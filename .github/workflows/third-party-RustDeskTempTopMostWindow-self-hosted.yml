name: build RustDeskTempTopMostWindow (self-hosted)

on:
  workflow_call:
    inputs:
        upload-artifact:
          type: boolean
          default: true
        artifact-prefix:
          type: string
          default: ""
        target:
            description: 'Target'
            required: true
            type: string
            default: 'windows-2022'
        configuration:
            description: 'Configuration'
            required: true
            type: string
            default: 'Release'
        platform:
            description: 'Platform'
            required: true
            type: string
            default: 'x64'
        target_version:
            description: 'TargetVersion'
            required: true
            type: string
            default: 'Windows10'

env:
  project_path: WindowInjection/WindowInjection.vcxproj

jobs:
  build-RustDeskTempTopMostWindow:
    runs-on: [self-hosted, Windows, windows-2022]
    strategy:
        fail-fast: false
    env:
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/${{ inputs.platform }}/${{ inputs.configuration }}
    steps:
      - name: Ensure Git on PATH (self-hosted)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($dir in @(
            'C:\Program Files\Git\cmd',
            'C:\Program Files\Git\bin',
            'C:\Program Files (x86)\Git\cmd'
          )) {
            $git = Join-Path $dir 'git.exe'
            if (Test-Path $git) {
              Write-Host "Using Git: $git"
              & $git --version
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              exit 0
            }
          }
          Write-Error "Git 2.18+ not found. Install Git for Windows and restart the actions-runner service."

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Download the source code
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

      - name: Build the project
        run: |
          cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          msbuild ${{ env.project_path }} -p:Configuration=${{ inputs.configuration }} -p:Platform=${{ inputs.platform }} /p:TargetVersion=${{ inputs.target_version }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.upload-artifact }}
        with:
            name: ${{ inputs.artifact-prefix }}topmostwindow-artifacts
            path: |
              ./${{ env.build_output_dir }}/WindowInjection.dll
