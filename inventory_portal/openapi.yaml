openapi: 3.1.0
info:
  title: TnursRemoteDeskWebApi
  version: 1.0.0
  description: >-
    API v1 for RustDesk device reports, administrator workflows, server registry,
    CI build uploads, and public software updates. All error responses use the
    Error schema. Successful v1 response bodies retain their existing shapes.
servers:
  - url: https://inventory.example.com
tags:
  - name: Client
  - name: Admin
  - name: Builds
  - name: Updates
paths:
  /api/v1/health:
    get:
      tags: [Client]
      summary: Health check
      responses:
        '200': { description: Service is healthy }
  /api/v1/report:
    post:
      tags: [Client]
      summary: Create or update a device report
      security: [{ DeviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Report' }
      responses:
        '200':
          description: Report accepted
          content:
            application/json:
              schema: { type: object, properties: { ok: { const: true } }, required: [ok] }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/v1/ad/assign:
    post:
      tags: [Client]
      summary: Assign a device to the configured AD address book
      security: [{ DeviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdAssignment' }
      responses:
        '200':
          description: Assignment outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [assigned, skipped] }
                  message: { type: string }
                required: [status]
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      tags: [Admin]
      summary: Exchange the administrator password for a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties: { password: { type: string, minLength: 1 } }
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in]
                properties:
                  token: { type: string }
                  expires_in: { type: integer, description: Lifetime in seconds }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      tags: [Admin]
      summary: List reported devices
      security: [{ AdminJWT: [] }]
      responses:
        '200':
          description: Devices, newest report first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}:
    delete:
      tags: [Admin]
      summary: Delete a device record
      security: [{ AdminJWT: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Device deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/servers:
    get:
      tags: [Client, Admin]
      summary: Read the shared RustDesk server registry
      security: [{ DeviceToken: [] }, { AdminJWT: [] }]
      responses:
        '200':
          description: Servers sorted by name and host
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Server' } }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Admin]
      summary: Add a server or update the entry with the same host
      description: Requires administrator JWT. A valid device token receives 403.
      security: [{ AdminJWT: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, public_key]
              properties:
                name: { type: string }
                host: { type: string, examples: [rustdesk.example.com:21116] }
                public_key: { type: string }
      responses:
        '200':
          description: Added or updated server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Server' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/admin/servers/{id}:
    delete:
      tags: [Admin]
      summary: Remove a server from the shared registry
      security: [{ AdminJWT: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Server deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/builds:
    get:
      tags: [Builds]
      summary: List builds and their publication status
      security: [{ AdminJWT: [] }]
      responses:
        '200':
          description: Builds newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Build' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [Builds]
      summary: Upload a build for administrator review
      security: [{ AdminJWT: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, flavor, platform, file]
              properties:
                version: { type: string }
                flavor: { type: string, enum: [normal, cashdesk] }
                platform: { type: string, enum: [windows, linux, macos, android] }
                architecture: { type: string, enum: [x86_64, aarch64, x86] }
                sha256: { type: string, description: Optional client hash verified by the server }
                file: { type: string, format: binary }
      responses:
        '200': { description: Uploaded build in pending state }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/admin/builds/{id}/approve:
    post:
      tags: [Builds]
      summary: Publish a pending build and archive the previous published build
      security: [{ AdminJWT: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Published build }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/builds/{id}:
    delete:
      tags: [Builds]
      summary: Delete a build record and its uploaded file
      security: [{ AdminJWT: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Build deleted }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/builds/{id}/reject:
    post:
      tags: [Builds]
      summary: Reject a pending build
      security: [{ AdminJWT: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Rejected build }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/ci/builds:
    post:
      tags: [Builds]
      summary: Upload a pending build from CI
      description: Bearer token is CI_UPLOAD_TOKEN or INVENTORY_DEVICE_TOKEN when CI_UPLOAD_TOKEN is empty.
      security: [{ CiToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, flavor, platform, file]
              properties:
                version: { type: string }
                flavor: { type: string, enum: [normal, cashdesk] }
                platform: { type: string, enum: [windows, linux, macos, android] }
                architecture: { type: string, enum: [x86_64, aarch64, x86] }
                sha256: { type: string }
                file: { type: string, format: binary }
      responses:
        '200': { description: Uploaded build in pending state }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/downloads/rustdesk/windows/meta:
    get:
      tags: [Updates]
      summary: Read latest published build metadata
      parameters:
        - { in: query, name: flavor, schema: { type: string, enum: [normal, cashdesk], default: normal } }
        - { in: query, name: platform, schema: { type: string, enum: [windows, linux, macos, android], default: windows } }
        - { in: query, name: artifact_type, schema: { type: string, enum: [exe, msi], default: exe } }
        - { in: query, name: architecture, schema: { type: string, enum: [x86_64, aarch64, x86] } }
      responses:
        '200':
          description: Published build availability
          content:
            application/json:
              schema:
                type: object
                required: [available, download_path]
                properties:
                  available: { type: boolean }
                  version: { type: string }
                  download_path: { type: string }
                  sha256: { type: string }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/downloads/rustdesk/windows/latest:
    get:
      tags: [Updates]
      summary: Download the latest published build
      parameters:
        - { in: query, name: flavor, schema: { type: string, enum: [normal, cashdesk], default: normal } }
        - { in: query, name: platform, schema: { type: string, enum: [windows, linux, macos, android], default: windows } }
        - { in: query, name: artifact_type, schema: { type: string, enum: [exe, msi], default: exe } }
        - { in: query, name: architecture, schema: { type: string, enum: [x86_64, aarch64, x86] } }
      responses:
        '200': { description: Binary file, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    head:
      tags: [Updates]
      summary: Read latest published build headers
      parameters:
        - { in: query, name: flavor, schema: { type: string, enum: [normal, cashdesk], default: normal } }
        - { in: query, name: platform, schema: { type: string, enum: [windows, linux, macos, android], default: windows } }
        - { in: query, name: artifact_type, schema: { type: string, enum: [exe, msi], default: exe } }
        - { in: query, name: architecture, schema: { type: string, enum: [x86_64, aarch64, x86] } }
      responses:
        '200': { description: Download headers }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/install/windows.ps1:
    get:
      tags: [Updates]
      summary: Get a one-command Windows MSI installation script
      parameters:
        - { in: query, name: flavor, required: true, schema: { type: string, enum: [normal, cashdesk] } }
      responses:
        '200': { description: PowerShell script detects architecture, verifies installer SHA-256, and runs MSI installation }
        '400': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    DeviceToken:
      type: http
      scheme: bearer
      description: INVENTORY_DEVICE_TOKEN configured on the portal.
    AdminJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CiToken:
      type: http
      scheme: bearer
      description: CI_UPLOAD_TOKEN, or the device token if unset.
  responses:
    Error:
      description: Machine-readable request error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [validation_error] }
        message: { type: string }
    Report:
      type: object
      required: [rustdesk_id]
      properties:
        rustdesk_id: { type: string }
        hostname: { type: string }
        os: { type: string }
        username: { type: string }
        cpu: { type: string }
        memory: { type: string }
        computer_summary: { type: string }
        ip_public: { type: string }
        ip_local: { type: string }
        temporary_password: { type: string }
        app_version: { type: string }
    AdAssignment:
      type: object
      required: [rustdesk_id]
      properties:
        rustdesk_id: { type: string }
        ad_domain: { type: string }
        ad_user: { type: string }
        display_name: { type: string }
        username: { type: string }
        hostname: { type: string }
        platform: { type: string }
    Device:
      type: object
      required: [rustdesk_id, hostname, os_info, username, ip_public, ip_local, temporary_password, computer_summary, app_version, updated_at]
      properties:
        rustdesk_id: { type: string }
        hostname: { type: string }
        os_info: { type: string }
        username: { type: string }
        ip_public: { type: string }
        ip_local: { type: string }
        temporary_password: { type: string }
        computer_summary: { type: string }
        app_version: { type: string }
        updated_at: { type: string, format: date-time }
        ad_status: { type: string, enum: [assigned, skipped, error] }
        ad_message: { type: string }
        ad_updated_at: { type: string, format: date-time }
    Server:
      type: object
      required: [id, name, host, public_key, created_by, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string }
        host: { type: string }
        public_key: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Build:
      type: object
      required: [id, flavor, platform, artifact_type, architecture, version, file_name, file_size, sha256, status, uploaded_at, approved_by]
      properties:
        id: { type: integer }
        flavor: { type: string, enum: [normal, cashdesk] }
        platform: { type: string, enum: [windows, linux, macos, android] }
        artifact_type: { type: string }
        architecture: { type: string }
        version: { type: string }
        file_name: { type: string }
        file_size: { type: integer }
        sha256: { type: string }
        status: { type: string, enum: [pending, published, archived, rejected] }
        uploaded_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }
        approved_by: { type: string }
