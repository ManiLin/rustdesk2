services:
  backend:
    build: ./backend
    container_name: inv-portal-api
    environment:
      DATABASE_URL: sqlite:/data/inventory.db?mode=rwc
      # Значения подставляются из файла `.env` в этой же папке (или из окружения shell).
      INVENTORY_DEVICE_TOKEN: ${INVENTORY_DEVICE_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Token for CI uploads (falls back to INVENTORY_DEVICE_TOKEN when empty).
      CI_UPLOAD_TOKEN: ${CI_UPLOAD_TOKEN:-}
      # AD -> shared address book (rustdeskweb token lives only here, never on clients).
      RUSTDESKWEB_API_URL: ${RUSTDESKWEB_API_URL:-https://tnremdeskapi.pxy2.tatnefturs.ru}
      RUSTDESKWEB_API_TOKEN: ${RUSTDESKWEB_API_TOKEN}
      AD_DOMAIN: ${AD_DOMAIN:-corp.tatnefturs.tatar}
      PRESET_ADDRESS_BOOK_NAME: ${PRESET_ADDRESS_BOOK_NAME:-corp.tatnefturs.tatar}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: inventory_portal_api=info,tower_http=info
    volumes:
      - inv_data:/data
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: inv-portal-web
    ports:
      - "${PORT:-1026}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  inv_data:
