server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Не афишировать сервис: без версии nginx в заголовках и баннерах ошибок.
    server_tokens off;

    # По умолчанию у nginx лимит тела запроса 1m — загрузка rustdesk.exe обрывалась с 413
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Единственная публичная часть — API, которое дёргают клиенты RustDesk.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Частая опечатка в адресе консоли. Порт сохраняем: $host его теряет,
    # и редирект уводил бы на :80 (ERR_CONNECTION_REFUSED).
    location = /management {
        return 301 $scheme://$http_host/managment/;
    }

    # Консоль управления (SPA) — единственная страница, и та по неочевидному пути.
    # В try_files нет $uri/ — иначе nginx на /managment делает 301 на адрес без порта.
    location /managment {
        try_files $uri /managment/index.html;
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # Корень и вообще всё остальное: пустая 404-заглушка, по которой
    # невозможно понять, что за сервис отвечает на этом адресе.
    location = / {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
