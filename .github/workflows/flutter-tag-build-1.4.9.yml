name: Flutter Tag Build 1.4.9

# Отдельный workflow для релиз-сборки 1.4.9 поверх ветки upgrade-1.4.9.
# Запускается:
#   1. Вручную (workflow_dispatch) — на выбранной ветке (по умолчанию upgrade-1.4.9).
#   2. Автоматически при пуше тега 1.4.9* (включая 1.4.9, 1.4.9-1, v1.4.9 и т.п.).
#   3. Автоматически при каждом пуше в ветку upgrade-1.4.9 (кроме правок только
#      документации, портала и макетов). Новый пуш отменяет ещё идущую сборку
#      той же ветки; сборки по тегам не отменяются.
#
# Собираются два варианта:
#   • обычный RustDesk (TnursRemoteDesk) с AD address book / API token
#   • cashdesk-сборка (incoming-only, без AD features)

on:
  workflow_dispatch:
  push:
    tags:
      - '1.4.9'
      - '1.4.9-*'
      - 'v1.4.9'
      - 'v1.4.9-*'
    branches:
      - upgrade-1.4.9
    # Path filters apply to branch pushes only (tags always build).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'inventory_portal/**'
      - '.superdesign/**'

concurrency:
  group: flutter-build-1_4_9-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  run-flutter-tag-1_4_9-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "1.4.9"
      inventory-report-url: "https://tnremdeskapi.pxy2.tatnefturs.ru/api/v1/report"

  run-flutter-tag-1_4_9-cashdesk-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "1.4.9-cashdesk"
      artifact-prefix: "cashdesk-"
      conn-type: "incoming"
      desktop-ui-flavor: "cashdesk"
      inventory-report-url: "https://tnremdeskapi.pxy2.tatnefturs.ru/api/v1/report"

  # After both builds succeeded: keep only the 3 newest versions in the
  # GitHub releases (old exe/msi/apk/... are deleted). The portal is untouched.
  prune-old-release-assets:
    needs:
      - run-flutter-tag-1_4_9-build
      - run-flutter-tag-1_4_9-cashdesk-build
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the 3 newest versions in the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/prune-release-assets.py
          "${{ github.repository }}" 1.4.9 3
          1.4.9 1.4.9-cashdesk upgrade-1.4.9 upgrade-1.4.9-cashdesk
