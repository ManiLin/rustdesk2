name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      inventory-report-url: "https://tnremdeskapi.pxy2.tatnefturs.ru/api/v1/report"

  run-flutter-nightly-cashdesk-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly-cashdesk"
      artifact-prefix: "cashdesk-"
      conn-type: "incoming"
      desktop-ui-flavor: "cashdesk"
      inventory-report-url: "https://tnremdeskapi.pxy2.tatnefturs.ru/api/v1/report"
